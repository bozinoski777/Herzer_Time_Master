name: Standort sync

on:
  schedule:
    # Runs shortly after daily-sync. The shared concurrency lock makes this
    # wait safely if daily-sync or another Notion workflow is still running.
    - cron: "27 6,14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared by every workflow that writes to the Herzer 2.0 POC.
  group: herzer-notion-mutations
  cancel-in-progress: false

jobs:
  standorte:
    name: Sync active D3 Standort options
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add active and remove unused inactive D3 Standort options
        run: node scripts/sync-standorte.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          D1_DATA_SOURCE_ID: ${{ secrets.D1_DATA_SOURCE_ID }}
          D7_DATA_SOURCE_ID: ${{ secrets.D7_DATA_SOURCE_ID }}
          D8_DATA_SOURCE_ID: ${{ secrets.D8_DATA_SOURCE_ID }}
