name: Onboard workers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared by every workflow that writes to the Herzer 2.0 POC, including
  # rollover and daily D3→D7 synchronization.
  group: herzer-notion-mutations
  cancel-in-progress: false

jobs:
  validate:
    name: "1 · Validate POC setup"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Notion schemas and worker-frontend layout
        run: node scripts/onboard-workers.js --validate-only
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          D1_DATA_SOURCE_ID: ${{ secrets.D1_DATA_SOURCE_ID }}
          D8_DATA_SOURCE_ID: ${{ secrets.D8_DATA_SOURCE_ID }}
          EMPLOYEE_FRONTENDS_DATA_SOURCE_ID: ${{ secrets.EMPLOYEE_FRONTENDS_DATA_SOURCE_ID }}
          # Backward-compatible discovery only; keep this while migrating the
          # existing action configuration to the new data-source secret.
          EMPLOYEE_FRONTEND_PAGE_ID: ${{ secrets.EMPLOYEE_FRONTEND_PAGE_ID }}

  provision:
    name: "2 · Worker page, D3, Urlaub KPI & Archiv"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create frontend, Aktueller Monat, Urlaub KPI, Archiv + Urlaub view
        run: node scripts/onboard-workers.js --provision-only
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          D1_DATA_SOURCE_ID: ${{ secrets.D1_DATA_SOURCE_ID }}
          D8_DATA_SOURCE_ID: ${{ secrets.D8_DATA_SOURCE_ID }}
          EMPLOYEE_FRONTENDS_DATA_SOURCE_ID: ${{ secrets.EMPLOYEE_FRONTENDS_DATA_SOURCE_ID }}
          # Backward-compatible discovery only; keep this while migrating the
          # existing action configuration to the new data-source secret.
          EMPLOYEE_FRONTEND_PAGE_ID: ${{ secrets.EMPLOYEE_FRONTEND_PAGE_ID }}
