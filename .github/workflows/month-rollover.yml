name: Archive completed month and prepare current month

on:
  schedule:
    # GitHub Actions cron is UTC. The cadence job below runs rollover at
    # 00:15 Europe/Berlin in both CET and CEST; the other entry exits before
    # it reads or changes Notion. It still runs daily so a missed first-of-month
    # execution is safely caught up the next day.
    - cron: "15 22 * * *"
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      target_worker:
        description: "Optional exact Worker Key or employee name; required when simulating."
        required: false
        type: string
      simulation:
        description: "Opt in to a simulated Berlin current date (never used by the schedule)."
        required: false
        default: false
        type: boolean
      simulated_current_date:
        description: "Simulation only: YYYY-MM-DD, for example 2026-10-01."
        required: false
        type: string

permissions:
  contents: read

# This is deliberately the same group as onboarding and daily sync. A queued
# job is safer than overlapping Notion writes to the same D3/D4/D7 records.
concurrency:
  group: herzer-notion-mutations
  cancel-in-progress: false

jobs:
  cadence:
    name: Confirm Berlin rollover cadence
    runs-on: ubuntu-latest
    outputs:
      run_rollover: ${{ steps.decide.outputs.run_rollover }}
    steps:
      - id: decide
        name: Run only at 00:15 Berlin time
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          run_rollover=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_rollover=true
          else
            berlin_offset="$(TZ=Europe/Berlin date +%z)"
            case "$berlin_offset|$SCHEDULE" in
              "+0200|15 22 * * *"|"+0100|15 23 * * *")
                run_rollover=true
                ;;
            esac
          fi

          echo "run_rollover=$run_rollover" >> "$GITHUB_OUTPUT"

  rollover:
    needs: cadence
    if: needs.cadence.outputs.run_rollover == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Archive completed D3 months and prepare D3
        run: node scripts/month-rollover.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          D1_DATA_SOURCE_ID: ${{ secrets.D1_DATA_SOURCE_ID }}
          D7_DATA_SOURCE_ID: ${{ secrets.D7_DATA_SOURCE_ID }}
          D8_DATA_SOURCE_ID: ${{ secrets.D8_DATA_SOURCE_ID }}
          # Kept empty until the one-worker simulation has been approved. A
          # disabled scheduled run exits before it reads or changes Notion.
          ROLLOVER_LIVE_ENABLED: ${{ secrets.ROLLOVER_LIVE_ENABLED }}
          # These expressions yield empty strings for scheduled runs. The
          # script additionally rejects any simulated value unless GitHub says
          # the event is workflow_dispatch.
          ROLLOVER_TARGET_WORKER: ${{ inputs.target_worker || '' }}
          ROLLOVER_SIMULATION: ${{ inputs.simulation && 'true' || 'false' }}
          ROLLOVER_SIMULATED_CURRENT_DATE: ${{ inputs.simulation && inputs.simulated_current_date || '' }}
