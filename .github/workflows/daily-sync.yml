name: Daily worker sync

on:
  schedule:
    # GitHub Actions cron is UTC. The cadence job below chooses exactly the
    # two entries that are 07:15 and 15:15 in Europe/Berlin, in both CET and
    # CEST. The other two scheduled runs exit before any Notion access.
    - cron: "15 5 * * 1-5"
    - cron: "15 6 * * 1-5"
    - cron: "15 13 * * 1-5"
    - cron: "15 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared by every workflow that writes to the Herzer 2.0 POC. In particular,
  # D3→D7 sync must not read D3 while month-rollover is archiving its old rows.
  group: herzer-notion-mutations
  cancel-in-progress: false

jobs:
  cadence:
    name: Confirm Berlin daily cadence
    runs-on: ubuntu-latest
    outputs:
      run_sync: ${{ steps.decide.outputs.run_sync }}
    steps:
      - id: decide
        name: Run only at 07:15 or 15:15 Berlin time
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          run_sync=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_sync=true
          else
            berlin_offset="$(TZ=Europe/Berlin date +%z)"
            case "$berlin_offset|$SCHEDULE" in
              "+0200|15 5 * * 1-5"|"+0200|15 13 * * 1-5"|\
              "+0100|15 6 * * 1-5"|"+0100|15 14 * * 1-5")
                run_sync=true
                ;;
            esac
          fi

          echo "run_sync=$run_sync" >> "$GITHUB_OUTPUT"

  management:
    name: Upsert worker days into management
    needs: cadence
    if: needs.cadence.outputs.run_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upsert D3 worker days into D7 management
        run: node scripts/sync-management.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          D1_DATA_SOURCE_ID: ${{ secrets.D1_DATA_SOURCE_ID }}
          D7_DATA_SOURCE_ID: ${{ secrets.D7_DATA_SOURCE_ID }}
      - name: Create completed-sync marker
        run: touch "$RUNNER_TEMP/daily-worker-sync-complete"
      - name: Publish completed-sync marker for Standort Sync
        uses: actions/upload-artifact@v4
        with:
          name: daily-worker-sync-complete
          path: ${{ runner.temp }}/daily-worker-sync-complete
          retention-days: 1
