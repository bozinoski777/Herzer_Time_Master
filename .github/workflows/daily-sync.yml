name: Daily worker sync

on:
  schedule:
    # 06:17 and 14:17 UTC on UTC weekdays. See README for DST effects.
    - cron: "17 6,14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared by every workflow that writes to the Herzer 2.0 POC. In particular,
  # D3→D7 sync must not read D3 while month-rollover is archiving its old rows.
  group: herzer-notion-mutations
  cancel-in-progress: false

jobs:
  management:
    name: "1 · Upsert worker days into management"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upsert D3 worker days into D7 management
        run: node scripts/sync-management.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          D1_DATA_SOURCE_ID: ${{ secrets.D1_DATA_SOURCE_ID }}
          D7_DATA_SOURCE_ID: ${{ secrets.D7_DATA_SOURCE_ID }}

  standorte:
    name: "2 · Sync active D3 Standort options"
    needs: management
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add active and remove unused inactive D3 Standort options
        run: node scripts/sync-standorte.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          D1_DATA_SOURCE_ID: ${{ secrets.D1_DATA_SOURCE_ID }}
          D7_DATA_SOURCE_ID: ${{ secrets.D7_DATA_SOURCE_ID }}
          D8_DATA_SOURCE_ID: ${{ secrets.D8_DATA_SOURCE_ID }}
