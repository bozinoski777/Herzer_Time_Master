name: Migrate legacy Tagtyp to Standort

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Apply the reviewed migration (otherwise the run is read-only)."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: herzer-notion-mutations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate reviewed legacy worker values
        run: node scripts/migrate-tagtyp-to-standort.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          D1_DATA_SOURCE_ID: ${{ secrets.D1_DATA_SOURCE_ID }}
          D7_DATA_SOURCE_ID: ${{ secrets.D7_DATA_SOURCE_ID }}
          TAGTYP_MIGRATION_EXECUTE: ${{ inputs.execute && 'true' || 'false' }}
